<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ece Erdem — Links</title>
<meta name="description" content="Links to my homepage and project repository.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f4ef;       /* warm off-white */
    --ink:#16202e;         /* deep slate ink */
    --ink-soft:#56606e;    /* muted text */
    --line:#d7d2c7;        /* hairline */
    --edge:#c9d1da;        /* graph edges */
    --node:#1b3a6b;        /* graph nodes / accent */
    --accent:#1b3a6b;      /* primary accent */
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Inter",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    line-height:1.5;
  }
  .wrap{
    width:100%;
    max-width:440px;
    animation:rise .6s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* header with graph motif */
  .head{position:relative;padding:8px 0 26px;text-align:center}
  .motif{
    position:absolute;inset:-10px 0 auto 0;height:96px;width:100%;
    z-index:0;opacity:.6;pointer-events:none;
  }
  .head-inner{position:relative;z-index:1;padding-top:30px}
  .name{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:clamp(28px,8vw,36px);
    letter-spacing:-.02em;
    line-height:1.05;
  }
  .role{
    margin-top:8px;
    font-size:14px;
    color:var(--ink-soft);
  }
  .role .dot{color:var(--node);font-weight:700}

  /* link cards */
  .links{margin-top:22px;display:flex;flex-direction:column;gap:14px}
  a.link{
    display:flex;align-items:center;gap:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px;
    text-decoration:none;color:inherit;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    min-height:64px;
  }
  a.link:hover,a.link:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 8px 22px -10px rgba(22,32,46,.35);
    border-color:var(--node);
    outline:none;
  }
  a.link:focus-visible{box-shadow:0 0 0 3px rgba(27,58,107,.35)}
  .ic{
    flex:0 0 44px;height:44px;width:44px;border-radius:11px;
    background:rgba(27,58,107,.08);
    display:grid;place-items:center;color:var(--node);
  }
  .ic svg{width:22px;height:22px;display:block}
  .meta{flex:1;min-width:0}
  .meta .t{
    font-family:"Space Grotesk",sans-serif;
    font-weight:600;font-size:17px;letter-spacing:-.01em;
  }
  .meta .s{
    font-size:13px;color:var(--ink-soft);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .meta .s.mono{font-family:"Space Mono",monospace;font-size:12px}
  .tag{
    display:inline-block;margin-top:6px;
    font-family:"Space Mono",monospace;font-size:10.5px;
    letter-spacing:.04em;text-transform:uppercase;
    color:var(--node);background:rgba(27,58,107,.07);
    padding:2px 7px;border-radius:5px;
  }
  .arrow{flex:0 0 auto;color:var(--ink-soft);transition:transform .18s ease}
  a.link:hover .arrow{transform:translateX(3px);color:var(--node)}
  .arrow svg{width:18px;height:18px;display:block}

  footer{
    margin-top:26px;text-align:center;
    font-size:12px;color:var(--ink-soft);
  }

  @media (prefers-reduced-motion:reduce){
    .wrap{animation:none}
    a.link,.arrow{transition:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <svg class="motif" viewBox="0 0 440 96" fill="none" aria-hidden="true">
        <g stroke="var(--edge)" stroke-width="1.4">
          <line x1="70" y1="58" x2="150" y2="30"/>
          <line x1="150" y1="30" x2="220" y2="62"/>
          <line x1="220" y1="62" x2="300" y2="28"/>
          <line x1="300" y1="28" x2="372" y2="56"/>
          <line x1="150" y1="30" x2="220" y2="20"/>
          <line x1="220" y1="62" x2="300" y2="68"/>
          <line x1="70" y1="58" x2="120" y2="74"/>
        </g>
        <g fill="var(--node)">
          <circle cx="70" cy="58" r="4.5"/>
          <circle cx="150" cy="30" r="5.5"/>
          <circle cx="220" cy="62" r="6.5"/>
          <circle cx="300" cy="28" r="5.5"/>
          <circle cx="372" cy="56" r="4.5"/>
          <circle cx="220" cy="20" r="3.5"/>
          <circle cx="300" cy="68" r="3.5"/>
          <circle cx="120" cy="74" r="3.5"/>
        </g>
      </svg>
      <div class="head-inner">
        <h1 class="name">Ece Erdem</h1>
        <p class="role">PhD Researcher <span class="dot">·</span> Fair Link Recommendation &amp; Network Structure</p>
      </div>
    </header>

    <nav class="links">
      <a class="link" href="https://elifeceerdem.github.io/">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
        </span>
        <span class="meta">
          <span class="t">Personal homepage</span>
          <span class="s">Research, publications &amp; contact</span>
        </span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
      </a>

      <a class="link" href="https://anonymous.4open.science/r/CAFE-7D28/README.md">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 16-4-4 4-4"/><path d="m16 8 4 4-4 4"/><path d="m13 5-2 14"/></svg>
        </span>
        <span class="meta">
          <span class="t">Project code &amp; docs</span>
          <span class="s mono">anonymous.4open.science/r/CAFE-7D28</span>
          <span class="tag">anonymized · under review</span>
        </span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
      </a>
    </nav>

    <footer>Thanks for stopping by the poster.</footer>
  </main>
</body>
</html>
